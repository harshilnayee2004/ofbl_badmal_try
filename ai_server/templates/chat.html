<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --user-msg: #3b82f6;
            --bot-msg: #334155;
            --border: #334155;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background-color: var(--chat-bg);
            border-radius: 1rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .chat-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 1rem;
            background: linear-gradient(to right, rgba(30, 41, 59, 1), rgba(15, 23, 42, 0.8));
        }

        .chat-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #22c55e;
        }

        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: 1rem;
            line-height: 1.5;
            animation: slideIn 0.3s ease-out;
            word-wrap: break-word;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        .bot-message {
            align-self: flex-start;
            background-color: var(--bot-msg);
            color: var(--text-main);
            border-bottom-left-radius: 0.25rem;
        }

        .input-area {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            background-color: var(--chat-bg);
        }

        .input-form {
            display: flex;
            gap: 0.5rem;
        }

        .chat-input {
            flex: 1;
            padding: 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--accent);
        }

        .send-btn {
            padding: 0 1.5rem;
            border-radius: 0.75rem;
            border: none;
            background-color: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .send-btn:hover {
            background-color: var(--accent-hover);
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        .send-btn:disabled {
            background-color: var(--bg-color);
            color: var(--text-muted);
            cursor: not-allowed;
            border: 1px solid var(--border);
        }

        /* Loading Dots */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 5px;
            padding: 1rem 1.25rem;
            background-color: var(--bot-msg);
            border-radius: 1rem;
            border-bottom-left-radius: 0.25rem;
            align-self: flex-start;
            width: fit-content;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .markdown-content pre {
            background-color: var(--bg-color);
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 1rem 0;
            border: 1px solid var(--border);
        }
        
        .markdown-content code {
            font-family: monospace;
            background-color: var(--bg-color);
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <span class="status-dot"></span>
            <div class="chat-title">MIPL AI Engine</div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                Hello! I am ready to help you. How can I assist you today?
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="input-area">
            <form class="input-form" id="chatForm">
                <input type="text" id="promptInput" class="chat-input" placeholder="Type your message..." autocomplete="off" required>
                <button type="submit" id="sendBtn" class="send-btn">Send</button>
            </form>
        </div>
    </div>

    <!-- Include marked.js for simple markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        const chatForm = document.getElementById('chatForm');
        const promptInput = document.getElementById('promptInput');
        const chatMessages = document.getElementById('chatMessages');
        const typingIndicator = document.getElementById('typingIndicator');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(content, isUser = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            if (isUser) {
                msgDiv.textContent = content;
            } else {
                // Parse markdown for bot messages
                msgDiv.innerHTML = marked.parse(content);
                msgDiv.classList.add('markdown-content');
            }
            
            chatMessages.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showLoading() {
            chatMessages.appendChild(typingIndicator);
            typingIndicator.style.display = 'flex';
            sendBtn.disabled = true;
            promptInput.disabled = true;
            scrollToBottom();
        }

        function hideLoading() {
            typingIndicator.style.display = 'none';
            // Move typing indicator back to body so it doesn't get messed up if chat breaks
            document.querySelector('.chat-container').insertBefore(typingIndicator, document.querySelector('.input-area'));
            sendBtn.disabled = false;
            promptInput.disabled = false;
            promptInput.focus();
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            addMessage(prompt, true);
            promptInput.value = '';
            showLoading();

            const formData = new FormData();
            formData.append('prompt', prompt);

            try {
                const response = await fetch('/inference/chat', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const result = await response.json();
                
                if (result.status && result.object) {
                    addMessage(result.object, false);
                } else {
                    addMessage("Sorry, I encountered an error while processing your request.", false);
                }
            } catch (error) {
                console.error("Error:", error);
                addMessage("Failed to connect to the server. Please check your connection and try again.", false);
            } finally {
                hideLoading();
            }
        });
    </script>
</body>
</html>
