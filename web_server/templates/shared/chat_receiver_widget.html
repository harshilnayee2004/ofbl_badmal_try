<style>
    /* LinkedIn style floating chat (Receiver) */
    .chat-widget-container-rx {
        position: fixed;
        bottom: 0;
        right: 20px;
        width: 300px;
        background: #fff;
        border-radius: 8px 8px 0 0;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
        z-index: 1050;
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease;
    }

    .chat-widget-container-rx.collapsed {
        transform: translateY(calc(100% - 45px));
    }

    .chat-header-rx {
        background: #dc3545;
        /* Red to grab attention as urgency from admin */
        color: white;
        padding: 10px 15px;
        border-radius: 8px 8px 0 0;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: bold;
    }

    .chat-body-rx {
        height: 300px;
        display: flex;
        flex-direction: column;
    }

    .messages-container-rx {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        background: #fff;
        display: flex;
        flex-direction: column;
    }

    .message-blob-rx {
        max-width: 90%;
        margin-bottom: 10px;
        padding: 8px 12px;
        border-radius: 12px;
        font-size: 0.9em;
        word-wrap: break-word;
    }

    .message-received-rx {
        background: #f3f2ef;
        align-self: flex-start;
        margin-right: auto;
        border-bottom-left-radius: 2px;
        border: 1px solid #ddd;
    }

    .chat-badge {
        background-color: white;
        color: #dc3545;
        border-radius: 50%;
        padding: 2px 6px;
        font-size: 0.75rem;
        font-weight: bold;
        display: none;
        margin-left: 10px;
    }

    @keyframes ringbell {
        0% {
            transform: rotate(0);
        }

        10% {
            transform: rotate(15deg);
        }

        20% {
            transform: rotate(-15deg);
        }

        30% {
            transform: rotate(10deg);
        }

        40% {
            transform: rotate(-10deg);
        }

        50% {
            transform: rotate(5deg);
        }

        60% {
            transform: rotate(-5deg);
        }

        70% {
            transform: rotate(0);
        }

        100% {
            transform: rotate(0);
        }
    }

    .ringing {
        animation: ringbell 1s ease-in-out;
        display: inline-block;
    }
</style>

<div class="chat-widget-container-rx collapsed" id="receiverChatWidget">
    <div class="chat-header-rx" onclick="toggleReceiverChat()">
        <span class="d-flex align-items-center">
            <span class="material-symbols-outlined me-1 fs-5">notifications_active</span> Messages
            <span class="chat-badge" id="chatUnreadBadge">0</span>
        </span>
        <span class="material-symbols-outlined" id="receiverChatIcon">expand_less</span>
    </div>
    <div class="chat-body-rx">
        <div class="messages-container-rx" id="messagesContainerRx">
            <!-- Messages appended here -->
        </div>
        <div class="p-2 border-top bg-light text-center small text-muted">
            <span class="material-symbols-outlined fs-6" style="vertical-align: text-bottom;">info</span> Admins
            configuration is read-only
        </div>
    </div>
</div>

<script>
    const currentUserId = {{ user.id if user else "null" }};
    const currentUserRole = "{{ user.role if user else 'user' }}";
</script>
