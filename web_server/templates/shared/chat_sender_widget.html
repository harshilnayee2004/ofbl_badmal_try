<style>
/* LinkedIn style floating chat */
.chat-widget-container {
    position: fixed;
    bottom: 0;
    right: 20px;
    width: 320px;
    background: #fff;
    border-radius: 8px 8px 0 0;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    z-index: 1050;
    display: flex;
    flex-direction: column;
    transition: transform 0.3s ease;
}
.chat-widget-container.collapsed {
    transform: translateY(calc(100% - 45px));
}
.chat-header {
    background: #0a66c2; 
    color: white;
    padding: 10px 15px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
}
.chat-body {
    height: 350px;
    display: flex;
    flex-direction: column;
}
.chat-users-list {
    flex: 1;
    overflow-y: auto;
    border-bottom: 1px solid #ddd;
    display: none;
}
.chat-users-list.active {
    display: block;
}
.user-item {
    padding: 10px 15px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    display: flex;
    align-items: center;
}
.user-item:hover {
    background: #f3f2ef;
}
.user-avatar {
    width: 32px;
    height: 32px;
    background: #ccc;
    border-radius: 50%;
    display: inline-block;
    margin-right: 10px;
    color: white;
    text-align: center;
    line-height: 32px;
    font-size: 14px;
}
.chat-conversation {
    flex: 1;
    display: none;
    flex-direction: column;
    min-height: 0;
}
.chat-conversation.active {
    display: flex;
}
.conversation-header {
    padding: 8px 10px;
    background: #f3f2ef;
    display: flex;
    align-items: center;
    cursor: pointer;
    font-size: 0.9em;
    border-bottom: 1px solid #ddd;
}
.messages-container {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    background: #fff;
    display: flex;
    flex-direction: column;
    min-height: 0;
}
.message-blob {
    max-width: 80%;
    margin-bottom: 10px;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 0.9em;
    word-wrap: break-word;
}
.message-sent {
    background: #0a66c2;
    color: white;
    align-self: flex-end;
    margin-left: auto;
    border-bottom-right-radius: 2px;
}
.message-received {
    background: #f3f2ef;
    align-self: flex-start;
    margin-right: auto;
    border-bottom-left-radius: 2px;
}
.chat-input-area {
    padding: 10px;
    border-top: 1px solid #ddd;
    display: flex;
}
.chat-input {
    flex: 1;
    border: none;
    background: #f3f2ef;
    border-radius: 20px;
    padding: 8px 15px;
    outline: none;
}
.send-btn {
    background: transparent;
    border: none;
    color: #0a66c2;
    font-weight: bold;
    cursor: pointer;
    margin-left: 10px;
}
</style>

<div class="chat-widget-container collapsed" id="senderChatWidget">
    <div class="chat-header" onclick="toggleSenderChat()">
        <span>Messaging</span>
        <span class="material-symbols-outlined" id="senderChatIcon">expand_less</span>
    </div>
    <div class="chat-body">
        <!-- Conversation view -->
        <div class="chat-conversation active" id="chatConversation">
            <div class="conversation-header">
                <span id="activeChatUserName" class="fw-bold">Company Broadcast</span>
            </div>
            <div class="messages-container" id="messagesContainer">
                <!-- Messages appended here -->
            </div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chatMessageInput" placeholder="Write a message...">
                <button class="send-btn" onclick="sendChatMessage()">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
    const currentUserId = {{ user.id if user else "null" }};
    const currentUserRole = "{{ user.role if user else 'user' }}";
</script>
<script src="/static/js/chat_sender.js"></script>
