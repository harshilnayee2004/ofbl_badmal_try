# Single place that says what each model detects and what counts as good/defect.
# Class names come from the .pth checkpoints (MODEL_REPORT.md). ASSUMPTIONS are marked - confirm on real images.
# rule types:
#   required  : class must be seen (min_count, default 1)      -> missing = DEFECT
#   forbidden : class must NOT be seen                         -> seen = DEFECT
#   pair      : good/bad class lists; bad seen = DEFECT, nothing seen = DEFECT
#   count     : exactly `count` boxes of class
# ignore_classes: Roboflow parent/dummy class at index 0 - never shown.
models:
  carrier_seal_label:
    stage: carrier
    path: ai_models/Carrier_6AL_Seal_Label.pth
    variant: small
    threshold: 0.65
    class_names: [sealed-explosive-carrier6AL, explosiveLabel, sealed]
    ignore_classes: [sealed-explosive-carrier6AL]
    checks:
      - {id: carrier_seal,  label: "Carrier seal intact",          rule: face_feature, class: sealed}
      - {id: carrier_label, label: "1.4G explosive label (carrier)", rule: face_feature, class: explosiveLabel}

  carrier_seal:
    stage: carrier
    path: ai_models/Carrier_6AL_Seal_Label.pth
    variant: small
    threshold: 0.65
    class_names: [sealed-explosive-carrier6AL, explosiveLabel, sealed]
    ignore_classes: [sealed-explosive-carrier6AL, explosiveLabel]
    checks:
      - {id: carrier_seal,  label: "Carrier seal intact", rule: required, class: sealed}

  carrier_label:
    stage: carrier
    path: ai_models/Carrier_6AL_Seal_Label.pth
    variant: small
    threshold: 0.65
    class_names: [sealed-explosive-carrier6AL, explosiveLabel, sealed]
    ignore_classes: [sealed-explosive-carrier6AL, sealed]
    checks:
      - {id: carrier_label, label: "1.4G explosive label (carrier)", rule: required, class: explosiveLabel}

  carrier_rust:
    stage: carrier
    path: ai_models/Carrier_6AL_Rust.pth
    variant: small
    threshold: 0.50
    class_names: [rust-carrier, rust-carrier]
    checks:
      - {id: carrier_rust, label: "Carrier free of rust", rule: forbidden, class: rust-carrier}

  h2a_seal_label:
    stage: box
    path: ai_models/H2A_Box_Seal_Label.pth
    variant: small
    threshold: 0.65
    class_names: [sealed2, explosiveLabel, sealed]
    ignore_classes: [sealed2]
    checks:
      - {id: h2a_seal,  label: "H2A box wire seal intact",     rule: face_feature, class: sealed}
      - {id: h2a_label, label: "1.4G/1.4S explosive label (H2A)", rule: face_feature, class: explosiveLabel}

  h2a_seal:
    stage: box
    path: ai_models/H2A_Box_Seal_Label.pth
    variant: small
    threshold: 0.65
    class_names: [sealed2, explosiveLabel, sealed]
    ignore_classes: [sealed2, explosiveLabel]
    checks:
      - {id: h2a_seal, label: "H2A box wire seal intact", rule: required, class: sealed}

  h2a_label:
    stage: box
    path: ai_models/H2A_Box_Seal_Label.pth
    variant: small
    threshold: 0.65
    class_names: [sealed2, explosiveLabel, sealed]
    ignore_classes: [sealed2, sealed]
    checks:
      - {id: h2a_label, label: "1.4G explosive label (H2A)", rule: required, class: explosiveLabel}

  h2a_rust:
    stage: box
    path: ai_models/H2A_Box_Rust.pth
    variant: large
    threshold: 0.50
    class_names: [H2A-rust, H2A-rust]
    checks:
      - {id: h2a_rust, label: "H2A box free of rust", rule: forbidden, class: H2A-rust}

  h2a_inner:
    stage: box
    path: ai_models/H2A_Box_Inner_Fitments.pth
    variant: small
    threshold: 0.90
    class_names: [PaparSlip-WoodenSheet-7RpN--m69m, CottonSheet, Diaphgarm, PaperSlip, WoodenSheet]
    ignore_classes: [PaparSlip-WoodenSheet-7RpN--m69m]
    checks:
      - {id: cotton,      label: "Cotton / felt sheet present", rule: required, class: CottonSheet}
      - {id: diaphragm,   label: "2 wooden diaphragms",        rule: required, class: Diaphgarm, min_count: 2}
      - {id: packing_slip, label: "Packing slip present",      rule: required, class: PaperSlip}
      - {id: wooden_sheet, label: "Plywood sheet present",     rule: required, class: WoodenSheet}

  primer_assembly:
    stage: primer
    path: ai_models/Primer_1AL_Assembly_Liner_Ring.pth
    variant: small
    threshold: 0.60
    class_names: [primer, improper_assembly, improper_paper_liner, proper_assembly, proper_paper_liner, rubber_present]
    checks:
      - {id: paper_liner, label: "Paper liner intact",   rule: pair, good: [proper_paper_liner], bad: [improper_paper_liner]}
      - {id: rubber_ring, label: "Rubber ring present",  rule: required, class: rubber_present}
      - {id: assembly,    label: "Magazine assembly",    rule: pair, good: [proper_assembly], bad: [improper_assembly]}

  primer_count:
    stage: box
    path: ai_models/H2A_Box_Primer_Count_18.pth
    variant: small
    resolution: 512
    threshold: 0.70
    class_names: [Primer]
    checks:
      - {id: primer_count, label: "Primer count = 18", rule: count, class: Primer, count: 18}   # tender: 18 per H2A box

  primer_paint:
    stage: primer
    path: ai_models/Primer_1AL_Paint_Peeling.pth
    variant: small
    resolution: 512
    threshold: 0.30
    class_names: [Paint_Peal]
    checks:
      - {id: paint_peel, label: "Free of paint peeling", rule: forbidden, class: Paint_Peal}

  carrier_rust:
    stage: carrier
    path: ai_models/Carrier_6AL_Rust.pth
    variant: large
    threshold: 0.50
    class_names: [rust-carrier, rust-carrier]
    checks:
      - {id: carrier_rust, label: "Carrier free of rust", rule: forbidden, class: rust-carrier}
