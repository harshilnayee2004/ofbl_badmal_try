{% extends "user/base.html" %}



{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 mb-md-4">
    <div class="d-flex align-items-center flex-wrap gap-2">
        <h1 class="d-flex align-items-center mb-0 h3 fw-bold">
            <span class="material-symbols-outlined me-2 fs-2 text-primary">dashboard_customize</span>
            Count {{count_type}}
        </h1>
        <span class="badge bg-light text-dark border font-monospace fs-6 py-1 px-2">Lot: <span id="lotNumber" class="fw-bold">--</span></span>
    </div>
    <input type="hidden" name="" id="lotId" value="{{lot_id}}">
    <input type="hidden" name="" id="count_type" value="{{count_type}}">
</div>

<div class="row g-3 g-lg-4 align-items-stretch">

    <!-- LEFT SIDE -->
    <div class="col-12 col-lg-8 d-flex">
        <div class="card shadow-sm border-0 flex-fill">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-2">
                <span class="fs-6 fw-bold d-flex align-items-center">
                    <span class="material-symbols-outlined me-1 fs-5">videocam</span>
                    Live Camera Feed (<span id="cameraViewTitle" class="text-light">Top View</span>)
                </span>
                <div class="d-flex align-items-center">
                    <div id="recordingIndicator"
                        class="recording-badge badge bg-danger text-uppercase d-flex align-items-center gap-1 d-none">
                        <span class="material-symbols-outlined" style="font-size: 1rem;">radio_button_checked</span>
                        REC
                    </div>
                </div>
            </div>
            <div class="card-body p-0 bg-black">
                <div class="ratio ratio-16x9">
                    <img src="/api/cameras/stream/PRIMER_BOX_TOP" id="cameraViewImage" alt="Camera Feed"
                        class="object-fit-cover">
                </div>
            </div>

        </div>
    </div>

    <div class="col-12 col-lg-4 d-flex">
        <div class="card shadow-sm border-0 flex-fill d-flex flex-column">
            <div class="card-header bg-light d-flex align-items-center justify-content-between py-2">
                <span class="fs-6 fw-bold d-flex align-items-center text-dark">
                    <span class="material-symbols-outlined me-1 fs-5">info</span>
                    Counting Information</span>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-12">
                        <h5 class="border-bottom pb-2 mb-1">Lot Information</h5>
                    </div>
                    <div class="col-12">
                        <div class="mb-2">
                            <span class="text-muted small d-block">Counting Status</span>
                            <span class="fw-bold placeholder-glow" id="countingStatus">
                                <span class="placeholder col-4"></span>
                            </span>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="mb-2">
                            <span class="text-muted small d-block" id="type_title"></span>
                            <span id="boxTypeOrFuzeType" class="fw-bold placeholder-glow">
                                <span class="placeholder col-6"></span>
                            </span>
                        </div>
                        <div class="mb-2">
                            <div class="form-group">
                                <span class="text-muted small d-block">Count</span>
                                <input type="text" id="count"
                                    class="form-control border-0 border-bottom rounded-0 px-0">
                            </div>
                        </div>
                        <div class="mb-2">
                            <span class="text-muted small d-block">Instruction</span>
                            <span id="instructionText" class="fw-bold text-primary placeholder-glow"><span
                                    class="placeholder col-8"></span></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-footer">
                <button type="button" class="btn btn-primary w-100 " onclick="startCounting()" id="startCountingBtn">
                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    <span class="btn-text">Start Counting</span>
                </button>
            </div>
        </div>
    </div>
</div>


<!-- Select Lot and Count Type Modal -->
<div class="modal fade" id="selectLotModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="selectLotModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="selectLotModalLabel">Select Lot and Count Type</h1>
                <a href="/user/dashboard" class="btn-close" aria-label="Close"></a>
            </div>
            <div class="modal-body">
                <div class="mb-4">
                    <label class="form-label d-block fw-bold text-secondary">Count Type</label>
                    <div class="btn-group w-100" role="group" aria-label="Count Type Selection">
                        <input type="radio" class="btn-check" name="countTypeRadio" id="countTypeBoxes" value="boxes"
                            autocomplete="off" checked>
                        <label class="btn btn-outline-primary" for="countTypeBoxes">Boxes</label>

                        <input type="radio" class="btn-check" name="countTypeRadio" id="countTypeFuzes" value="fuzes"
                            autocomplete="off">
                        <label class="btn btn-outline-primary" for="countTypeFuzes">Primers</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="lotSelect" class="form-label fw-bold text-secondary">Select Lot</label>
                    <select class="form-select" id="lotSelect">
                        <option value="">Loading pending/inspecting lots...</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary w-100" onclick="proceedWithSelection()">Proceed</button>
            </div>
        </div>
    </div>
</div>
</div>


<script src="{{ url_for('static', path='/js/user/count_boxes_fuzes.js') }}"></script>

{% endblock %}
