<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard{% endblock %}</title>
    <!-- Bootstrap 5 CSS (Local) -->
    <link href="{{ url_for('static', path='/css/bootstrap.min.css') }}" rel="stylesheet">
    <!-- Material Symbols Outlined (Local) -->
    <link href="{{ url_for('static', path='/css/material-symbols.css') }}" rel="stylesheet">
    <!-- DataTables Bootstrap 5 CSS (Local) -->
    <link href="{{ url_for('static', path='/css/dataTables.bootstrap5.min.css') }}" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="{{ url_for('static', path='/css/style.css') }}" rel="stylesheet">
    {% block stylesheets %}{% endblock %}
</head>

<body>
    <div class="d-flex" id="wrapper" style="height: 100vh; overflow: hidden;">
        <!-- Sidebar -->
        <div class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark" id="sidebar-wrapper"
            style="width: 280px; height: 100vh; overflow-y: auto;">
            <a href="/"
                class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <span class="material-symbols-outlined me-2 fs-4">verified_user</span>
                <span class="fs-4">Primer Inspection </span>
            </a>

            <hr>
            <ul class="nav nav-pills flex-column mb-auto">

                <!-- Dashboard -->
                <li class="nav-item">
                    <a href="/surveillance"
                    class="nav-link text-white d-flex align-items-center {% if request.url.path.startswith('/surveillance') and request.url.path != '/surveillance/ptz' %}active{% endif %}">
                        <span class="material-symbols-outlined me-2">dashboard</span>
                        Dashboard
                    </a>
                </li>

                <!-- PTZ Control -->
                <li class="nav-item">
                    <a href="/surveillance/ptz"
                    class="nav-link text-white d-flex align-items-center {% if request.url.path == '/surveillance/ptz' %}active{% endif %}">
                        <span class="material-symbols-outlined me-2">joystick</span>
                        PTZ Control
                    </a>
                </li>

            </ul>
            <hr>
            <a type="button" class="btn btn-outline-danger" href="/auth/logout">Logout</a>

        </div>

        <!-- Page Content -->
        <div class="d-flex flex-column flex-grow-1" style="height: 100vh; overflow-y: auto;">
            <!-- Top Navbar -->
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
                <div class="container-fluid">
                    <span class="cursor-pointer me-3" id="sidebarToggle"><span
                            class="material-symbols-outlined">menu</span></span>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="d-flex align-items-center">
                        <span class="material-symbols-outlined me-2">account_circle</span>
                        <strong>{{ user.email if user else 'Admin' }}</strong>
                    </div> <!-- <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-dark text-decoration-none dropdown-toggle"
                            id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="material-symbols-outlined me-2">account_circle</span>
                            <strong>{{ user.email if user else 'Admin' }}</strong>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
                            <li><a class="dropdown-item" href="#">Profile</a></li>
                            <li><a class="dropdown-item" href="#">Settings</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="/auth/logout">Sign out</a></li>
                        </ul>
                    </div> -->
                </div>
            </nav>

            <!-- Main Content Area -->
            <div class="container-fluid px-4 py-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div aria-live="polite" aria-atomic="true" class="position-relative">
        <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" id="toast-container"
            style="z-index: 1055;"></div>
    </div>

    <!-- Bootstrap 5 Bundle with Popper (Local) -->
    <script src="{{ url_for('static', path='/js/bootstrap.bundle.min.js') }}"></script>
    <!-- jQuery and DataTables (Local) -->
    <script src="{{ url_for('static', path='/js/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', path='/js/jquery.dataTables.min.js') }}"></script>
    <script src="{{ url_for('static', path='/js/dataTables.bootstrap5.min.js') }}"></script>
    <!-- Custom Script -->
    <script src="{{ url_for('static', path='/js/script.js') }}"></script>
    <script src="{{ url_for('static', path='/js/toaster.js') }}"></script>

    {% block scripts %}{% endblock %}
    {% include "shared/chat_sender_widget.html" %}
</body>

</html>
