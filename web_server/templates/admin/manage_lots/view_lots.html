{% extends "admin/base.html" %}

{% block title %}View Lots - Primer Inspection{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="d-flex align-items-center">
        <span class="material-symbols-outlined me-1 fs-1">inventory_2</span>
        View Lots
    </h1>
</div>

<div class="card mb-4 shadow-sm">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover" id="lotsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Lot Number</th>
                        <th>Primer Type</th>
                        <th>Box Type</th>

                        <th>Inspection Status</th>
                        <th>Created At</th>
                        <th>Created By</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows will be populated by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='/js/admin/view_lots.js') }}"></script>
{% endblock %}
