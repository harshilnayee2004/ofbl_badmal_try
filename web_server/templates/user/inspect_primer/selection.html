{% extends "user/base.html" %}



{% block content %}
<input type="hidden" name="" id="selectedLotId" value="">
<input type="hidden" name="" id="selectedLotNumber" value="">

<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 mb-md-4">
    <h1 class="d-flex align-items-center mb-0 h3 fw-bold">
        <span class="material-symbols-outlined me-2 fs-2" style="color: #d63384;">military_tech</span>
        Primer Electric 1A/L (Select Lot)
    </h1>
</div>

<div class="row">
    <div class="col-12 mb-4">
        <div class="card shadow-sm border-0 d-flex flex-column">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 text-nowrap" id="lotsTable">
                        <thead class="table-light sticky-top border-bottom">
                            <tr class="small text-uppercase text-muted">
                                <th class="ps-3">Lot Number</th>
                                <th>Types</th>
                                <th>Created</th>
                                <th>Status</th>
                                <th>Progress</th>
                                <th class="text-center pe-3">Action</th>
                            </tr>
                        </thead>
                        <tbody id="lotsListBody">
                            <!-- Lots will be dynamically loaded here by loadLots() -->
                            <tr id="lotsLoadingIndicator">
                                <td colspan="6" class="text-center text-muted py-5">
                                    <div class="spinner-border text-primary mb-2" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <br>Loading lots...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>


</script>

<script src="{{ url_for('static', path='/js/user/inspect_primer/selection_main.js') }}"></script>
{% endblock %}
